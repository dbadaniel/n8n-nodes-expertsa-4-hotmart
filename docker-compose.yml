services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n-hotmart-dev
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_LOG_LEVEL=debug
      - GENERIC_TIMEZONE=America/Sao_Paulo
      - TZ=America/Sao_Paulo
      - N8N_COMMUNITY_PACKAGES_ENABLED=true
      - N8N_CUSTOM_EXTENSIONS=/home/node/.n8n/custom
      - N8N_HOST=devn8n.expertsa.com.br
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://devn8n.expertsa.com.br/
      - N8N_EDITOR_BASE_URL=https://devn8n.expertsa.com.br/
    volumes:
      - n8n_data:/home/node/.n8n
      - ./:/home/node/.n8n/custom:ro

volumes:
  n8n_data:
